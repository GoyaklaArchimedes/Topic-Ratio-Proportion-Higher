const sections=[
['Understanding Ratio','A ratio compares amounts in a stated order. Each equal block represents one part.',[
['objects','Read a diagram','Count each colour separately. Write the numbers in the requested order.','The order in the question decides which number goes first.'],
['words','Ratio from words','Identify the two quantities and write their counts in the requested order.','Do not add the quantities for a part-to-part ratio.'],
['whole','Part to whole','Add all the parts to find the whole. Compare the requested part with this total.','The whole includes both groups.'],
['reverse','Reverse the order','Read the requested order carefully, then put each matching quantity in its position.','Blue:red and red:blue usually give different ratios.']]],
['Simplifying Ratios','Equivalent ratios keep the same comparison. Simplest form has no common factor greater than 1.',[
['simple2','Two-part ratios','Find the highest common factor (HCF). Divide both parts by it.','Divide every part by the same number.'],
['simple3','Three-part ratios','Find a factor common to all three parts. Divide every part by the HCF of all three.','A factor shared by just two parts may not work for the third.'],
['decimal','Decimal ratios','Multiply every part by 10 or 100 to remove the decimals, then simplify.','Do not round the parts.'],
['fractionratio','Ratios with fractions','Multiply every part by a common denominator, then simplify the resulting whole numbers.','Use a common multiplier for every part.'],
['already','Recognise simplest form','Check whether the HCF is 1. If it is, the ratio is already simplest.','A larger number in a ratio does not necessarily mean it can be simplified.']]],
['Ratios with Different Units','Convert to the same units first. Only then simplify.',[
['length','Length','Use 1 m = 100 cm and 1 km = 1000 m. Convert both lengths to one unit, then simplify.','Different units cannot be compared just by their written numbers.'],
['mass','Mass','Use 1 kg = 1000 g. Convert to grams, then divide both parts by their HCF.','1.5 kg is 1500 g.'],
['capacity','Capacity','Use 1 litre = 1000 ml. Convert to millilitres, then simplify.','Do the conversion before cancelling.'],
['time','Time','Use 1 hour = 60 minutes and 1 minute = 60 seconds. Convert to one unit first.','An hour has 60 minutes, not 100.'],
['money','Money','Use £1 = 100p. Express both amounts in pence before simplifying.','£2:50p is not 2:50.']]],
['Equivalent Ratios & Scaling','Multiply or divide every part by the same factor to keep a ratio equivalent.',[
['scaleup','Scale up','Find the multiplier for the known pair, then multiply the other part by the same factor.','Adding the same amount does not preserve a ratio.'],
['scaledown','Scale down','Find the divisor for the known pair, then divide the other part by it.','Apply the same divisor to every part.'],
['missing','Missing first part','Find the multiplier using the second part, then apply it to the first.','The missing value can appear in either position.'],
['ratiotable','Ratio tables','Each column is an equivalent pair. Use the multiplier between columns for both rows.','Compare matching rows and columns.'],
['unitratio','Ratios of the form 1:n or n:1','Divide both parts by the part that must become 1. The other part may be a decimal.','A unit ratio need not have two whole-number parts.']]],
['Sharing in a Ratio','A known total is split into equal parts. Total → total parts → one part → shares.',[
['share2','Share a total between two people','Add the ratio parts. Divide the total by that sum. Multiply one part by each ratio number.','Divide by total parts, not by one person’s parts.'],
['share3','Share a total in three parts','Add all three ratio numbers. Find one part and multiply to obtain all three shares.','Check that all three shares add back to the original total.'],
['sharefraction','Share a quantity','The method works for lengths and masses too: total ÷ total parts, then multiply.','Keep the unit on each share.'],
['largeshare','Find just the larger share','Calculate one part from the total. Multiply by the larger ratio number.','The larger ratio part receives the larger amount.']]],
['Finding Quantities from a Ratio','A known share is not a known total. Known share → its ratio parts → one part → required amount.',[
['knownfirst','First amount known','Divide the known amount by its own number of ratio parts. Multiply by the other number.','Do not divide the known share by the sum of the ratio parts.'],
['knownsecond','Second amount known','Match the known amount to the second ratio number, find one part, then find the first share.','Identify which share is actually given.'],
['knowntotal','Find the total from a share','Find one part from the known share. Multiply by the sum of all ratio parts.','The given share is only part of the total.'],
['difference','Difference known','Subtract the ratio numbers. The difference in amounts represents this many parts. Divide to find one part.','A difference is neither a share nor the total.']]],
['Ratio and Fractions','For A:B = a:b, A is <span class="fraction"><span>a</span><span>a + b</span></span> of the whole. Fractions can also be converted into ratios.',[
['ratiofraction','Ratio to a fraction of the whole','Add the ratio parts for the denominator. Use the requested group’s parts for the numerator. Simplify.','Use total parts as the denominator.'],
['fractiontoratio','Fraction of a whole to a ratio','If a fraction has numerator p and denominator q, the remaining part has numerator q−p. The ratio is p:(q−p).','The second group is the remainder, not the denominator.'],
['fractionamount','Use a ratio fraction to find an amount','Write the requested share as a fraction of total parts. Multiply the total by that fraction.','Check that the resulting shares sum to the total.'],
['threefraction','Fractions from a three-part ratio','Add all three parts. Divide the requested part by this total, then simplify.','Include every group in the whole.']]],
['Ratio, Fractions & Percentages','A percentage is a fraction out of 100. Link ratios to fractions of the total, then to percentages.',[
['ratiopercent','Ratio to percentage','Write the group as a fraction of total parts. Multiply by 100 to obtain a percentage.','Part-to-part and part-to-whole are different comparisons.'],
['percentratio','Percentage to ratio','Write selected:remaining as p:(100−p), then simplify.','The remaining percentage is 100−p.'],
['percentamount','Find a percentage share','Convert the ratio to a percentage or a fraction of the whole. Use that proportion of the total.','First find total ratio parts.'],
['mixedfraction','Ratio and percentage in stages','Use the ratio to find the first group. Then calculate the stated percentage of that group.','The percentage may refer to a group rather than the whole.']]],
['Direct Proportion — Unitary Method','In direct proportion, a fixed multiplier links the quantities. Find the amount for one unit, then scale.',[
['unitcost','Cost for one, then many','Divide the given cost by the number of items. Multiply that unit cost by the new number.','Assume identical items at the same unit price.'],
['unitquantity','Quantity for one, then many','Find the quantity needed for one item, then multiply by the required count.','Keep track of the quantity unit.'],
['exchange','Exchange rates','A rate gives foreign currency per £1. Multiply pounds by the rate; divide foreign currency by the rate.','This exercise assumes no commission or fees.'],
['proptable','Proportional tables and equations','Calculate y ÷ x for each non-zero pair. In direct proportion this is constant k and y = kx.','A constant difference alone does not prove direct proportion.'],
['propequation','Use y = kx','For directly proportional quantities, divide y by x to find the constant k. Then use y = kx for a new x.','Use multiplication by k, not adding k.'],
['conversiongraph','Read a conversion graph','Read across from a known axis value to the line, then to the other axis. A direct proportion line passes through the origin.','Check the axes and their units.']]],
['Recipes & Scaling','Scale every ingredient by the same factor. Check what the original recipe makes.',[
['recipeup','Scale a recipe up','New portions ÷ original portions gives the scale factor. Multiply every ingredient by it.','Scale ingredients, not just the number of portions.'],
['recipedown','Scale a recipe down','Use new portions ÷ original portions. A factor below 1 makes every ingredient smaller.','Do not subtract the same amount from each ingredient.'],
['recipeavailable','Ingredient available','Find ingredient per portion. Divide the available ingredient by this amount to find portions.','If whole portions are requested, round down.'],
['recipepair','Scale two ingredients','Find the portion multiplier. Apply it separately to both ingredient amounts.','Keep the ingredients in the requested order.']]],
['Best Buys & Unit Pricing','Compare like with like: cost per item, per 100 g or per kg. The lowest unit cost is best value.',[
['unitprice','Calculate a unit price','Divide total cost by the number of items. Convert pounds to pence if useful.','A cheaper pack is not automatically better value.'],
['bestitems','Compare packs','Find each price per item using the same currency unit. Compare the two values.','State the pack with the lower unit price.'],
['bestmass','Compare different masses','Convert masses to the same unit. Find each cost per 100 g or per kg.','Do not compare pack prices without comparing masses.'],
['offer','Multi-buy offers','Calculate the actual cost and quantity received. Divide total cost by total items.','Include the free items in the quantity.']]],
['Scale Drawings & Maps','A scale ratio uses the same units. A map key may instead state a real distance for each centimetre.',[
['mapreal','Map distance to real distance','Multiply map centimetres by the real distance per centimetre.','Use the key, not the size of your screen.'],
['mapdraw','Real distance to map distance','Divide the real distance by the real distance represented by 1 cm.','The answer is a drawing length in centimetres.'],
['scaleratio','Ratio scales','For 1:n, multiply drawing length by n in the same unit. Convert to the required real unit afterwards.','A ratio such as 1:200 compares matching units.'],
['findscale','Find a scale','Convert the real length to the drawing unit. Divide both sides of the ratio by the drawing length.','Convert units before writing 1:n.']]],

case 'share2':case 'share3':case 'sharefraction':case 'largeshare':{let parts=id==='share3'?[a,b,c]:[a,b],total=parts.reduce((x,y)=>x+y)*u,unit=id==='sharefraction'?'m':'£';text=id==='sharefraction'?`A ribbon is ${total} m long. Split it in the ratio ${a}:${b}. Find both lengths in order.`:`Share £${total} in the ratio ${parts.join(':')}. ${id==='largeshare'?'Find the larger share.':'Find all shares in order.'}`;share(total,parts);visual=partBars(parts,['First','Second','Third'],`Known TOTAL = ${total}${unit==='m'?' m':' pounds'}`);if(id==='largeshare'){num(Math.max(a,b)*u,'£');steps.push(`Larger share = ${Math.max(a,b)} × ${u} = £${Math.max(a,b)*u}.`)}else{parts.forEach((v,i)=>num(v*u,unit,`Share ${i+1}`));steps.push(...parts.map((v,i)=>`Share ${i+1} = ${v} × ${u} = ${v*u}${unit==='m'?' m':' pounds'}.`),`Check: shares add to ${total}.`)}break;}
case 'knownfirst':case 'knownsecond':case 'knowntotal':{let second=id==='knownsecond',known=(second?b:a)*u; text=`Asha:Ben = ${a}:${b}. ${second?'Ben':'Asha'} has £${known}. Find ${id==='knowntotal'?'the total amount':second?'Asha’s amount':'Ben’s amount'}.`;visual=bars(a,b,['Asha','Ben'],`Known SHARE: ${second?'Ben':'Asha'} has £${known}`);let target=id==='knowntotal'?a+b:second?a:b;num(target*u,'£');steps=[`The known £${known} represents ${second?b:a} parts.`,`One part = ${known} ÷ ${second?b:a} = £${u}.`,`Required amount = ${target} × ${u} = £${target*u}.`];break;}

case 'ratiopercent':case 'percentratio':case 'percentamount':case 'mixedfraction':{let [x,y]=C([[1,3],[2,3],[3,2],[1,4],[3,7],[4,1]]),p=100*x/(x+y),total=(x+y)*u*20;if(id==='ratiopercent'){text=`Red:blue = ${x}:${y}. What percentage of the counters is red?`;num(p,'%');steps=[`Total parts = ${x+y}.`,`Red fraction = ${fr(x,x+y)}.`,`${x} ÷ ${x+y} × 100 = ${p}%.`]}else if(id==='percentratio'){text=`${p}% of the beads are red. The rest are blue. Write red:blue in simplest form.`;ratio(simplify([p,100-p]));steps=[`Blue = 100 − ${p} = ${100-p}%.`,`Red:blue = ${p}:${100-p}.`,`Simplify to ${simplify([p,100-p]).join(':')}.`]}else if(id==='percentamount'){text=`A club has ${total} members. Juniors:adults = ${x}:${y}. Find the number of juniors.`;num(total*x/(x+y),'members');steps=[`Juniors are ${fr(x,x+y)} = ${p}% of members.`,`One part = ${total} ÷ ${x+y} = ${total/(x+y)}.`,`Juniors = ${x} × ${total/(x+y)} = ${total*x/(x+y)}.`]}else{let pc=C([10,20,25,50]),group=total*x/(x+y);text=`A club has ${total} members. Juniors:adults = ${x}:${y}. ${pc}% of the juniors swim. How many junior swimmers are there?`;num(group*pc/100,'swimmers');steps=[`Juniors = ${total} ÷ ${x+y} × ${x} = ${group}.`,`Junior swimmers = ${group} × ${pc} ÷ 100 = ${fmt(group*pc/100)}.`]}break;}

case 'proptable':{let offset=R(0,1)?0:u,yes=offset===0;text='Is y directly proportional to x in this table?';visual=table(['x','y'],[1,2,4].map(x=>[x,k*x+offset]));choice(yes?'Yes':'No',['Yes','No']);steps=[`Calculate y ÷ x: ${[1,2,4].map(x=>fmt((k*x+offset)/x)).join(', ')}.`,yes?`The multiplier is constant: k = ${k}. Therefore y = ${k}x, so yes.`:'The multipliers are different, so no.'];break;}

case 'recipeup':case 'recipedown':case 'recipepair':{let old=id==='recipedown'?n*2:n,newn=id==='recipedown'?n:n+k,per=C([25,40,50,60]),per2=C([10,15,20]);text=`A recipe for ${old} portions uses ${old*per} g of flour${id==='recipepair'?` and ${old*per2} g of sugar`:''}. How much ${id==='recipepair'?'flour and sugar':'flour'} is needed for ${newn} portions?`;num(newn*per,'g','Flour');if(id==='recipepair')num(newn*per2,'g','Sugar');steps=[`Scale factor = ${newn} ÷ ${old} = ${fmt(newn/old)}.`,`Flour = ${old*per} × ${fr(newn,old)} = ${newn*per} g.`];if(id==='recipepair')steps.push(`Sugar = ${old*per2} × ${fr(newn,old)} = ${newn*per2} g.`);break;}

case 'bestitems':{let pa=R(20,60),pb=pa+C([-5,5,10]),na=n,nb=n+k;text=`Pack A: ${na} pencils for ${money(na*pa/100)}. Pack B: ${nb} pencils for ${money(nb*pb/100)}. Which is better value?`;choice(pa<pb?'A':'B',['A','B']);steps=[`A: ${na*pa}p ÷ ${na} = ${pa}p per pencil.`,`B: ${nb*pb}p ÷ ${nb} = ${pb}p per pencil.`,`Pack ${pa<pb?'A':'B'} has the lower price per pencil.`];break;}
case 'bestmass':{let ma=C([200,400,500]),mb=C([600,800,1000]),pa=R(25,60),pb=pa+C([-5,5]);text=`Rice A: ${ma} g for ${money(ma*pa/10000)}. Rice B: ${fmt(mb/1000)} kg for ${money(mb*pb/10000)}. Which is better value?`;choice(pa<pb?'A':'B',['A','B']);steps=[`Convert B to ${mb} g.`,`A costs ${fmt(ma*pa/100)}p ÷ ${ma/100} = ${pa}p per 100 g.`,`B costs ${fmt(mb*pb/100)}p ÷ ${mb/100} = ${pb}p per 100 g.`,`Choose ${pa<pb?'A':'B'}.`];break;}
case 'offer':{let price=C([1.2,1.5,1.8,2.4]);text=`An offer is “buy ${a}, get 1 free”. Each item normally costs ${money(price)}. Find the cost per item received when using one offer. Give pence.`;num(price*100*a/(a+1),'p');steps=[`Pay for ${a}: total cost = ${money(price*a)} = ${fmt(price*a*100)}p.`,`Receive ${a+1} items.`,`Unit price = ${fmt(price*a*100)} ÷ ${a+1} = ${fmt(price*100*a/(a+1))}p.`];if(Math.abs(answers[0].value*100-Math.round(answers[0].value*100))>1e-6){answers[0].value=Math.round(answers[0].value*100)/100;text+=' Round to 2 decimal places.';steps.push(`Rounded unit price = ${answers[0].value.toFixed(2)}p.`)}break;}
case 'mapreal':text=`A map key says 1 cm represents ${k} km. Two places are ${a} cm apart on the map. Find their real distance.`;num(a*k,'km');steps=[`Each map centimetre represents ${k} km.`,`Real distance = ${a} × ${k} = ${a*k} km.`];break;
case 'mapdraw':text=`A map key says 1 cm represents ${k} km. A path is ${a*k} km long. How long is it on the map?`;num(a,'cm');steps=[`Map length = real distance ÷ distance per centimetre.`,`${a*k} ÷ ${k} = ${a} cm.`];break;

case 'distance':{let rate=C([36,48,60,72]),minutes=C([15,30,45,90]);text=`A vehicle travels at ${rate} km/h for ${minutes} minutes. How far does it travel?`;num(rate*minutes/60,'km');steps=[`Time = ${minutes} ÷ 60 = ${fmt(minutes/60)} hours.`,`Distance = ${rate} × ${fr(minutes,60)} = ${fmt(rate*minutes/60)} km.`];break;}
case 'journeytime':{let rate=C([30,40,60,80]),mins=C([15,30,45,75,90]),d=rate*mins/60;text=`How many minutes does a ${d} km journey take at a constant ${rate} km/h?`;num(mins,'minutes');steps=[`Time = distance ÷ speed = ${d} ÷ ${rate} = ${fmt(mins/60)} hours.`,`Convert to minutes: ${fr(d,rate)} × 60 = ${mins} minutes.`];break;}
case 'speedconvert':{let v=C([5,10,15,20,25]),reverse=R(0,1);text=reverse?`Convert ${fmt(v*3.6)} km/h to m/s.`:`Convert ${v} m/s to km/h.`;num(reverse?v:v*3.6,reverse?'m/s':'km/h');steps=[`1 hour = 3600 seconds; 1 km = 1000 m.`,`1 m/s = 3600 ÷ 1000 = 3.6 km/h.`,reverse?`${fmt(v*3.6)} ÷ 3.6 = ${v} m/s.`:`${v} × 3.6 = ${fmt(v*3.6)} km/h.`];break;}
case 'averagespeed':{let d1=a*10,d2=b*10,t1=30,t2=60,stop=C([0,15,30]);text=`A journey covers ${d1} km in 30 minutes, then ${d2} km in 60 minutes${stop?`, with a ${stop}-minute stop between the stages`:''}. Find the average speed for the whole journey, including any stop. Round to 1 decimal place.`;let v=(d1+d2)*60/(t1+t2+stop);num(Math.round(v*10)/10,'km/h');steps=[`Total distance = ${d1} + ${d2} = ${d1+d2} km.`,`Total time = 30 + 60 + ${stop} = ${90+stop} minutes = ${fr(90+stop,60)} hours.`,`Average speed = ${d1+d2} ÷ ${fr(90+stop,60)} = ${fmt(v)} km/h.`,`To 1 decimal place: ${(Math.round(v*10)/10).toFixed(1)} km/h.`];break;}
case 'distancegraph':{let speed=C([10,20,30,40]),hours=R(2,4);text=`The graph shows a journey at a steady speed. How fast is the traveller moving?`;visual=graph(speed,0,5,'Time (hours)','Distance (km)',[[0,0],[hours,hours*speed]]);num(speed,'km/h');steps=[`Use the points (0, 0) and (${hours}, ${hours*speed}).`,`Distance change = ${hours*speed} km; time change = ${hours} hours.`,`Speed = ${hours*speed} ÷ ${hours} = ${speed} km/h.`,`A horizontal distance–time segment would have zero distance change and mean a stop.`];break;}

case 'distancestop':{let xmax=a+b+c,ymax=u*(a+c),pts=[[0,0],[a,u*a],[a+b,u*a],[xmax,ymax]];text='How long is the traveller stationary on this distance–time graph?';visual=graph(ymax/xmax,0,xmax,'Time (hours)','Distance (km)',pts);let px=x=>65+x/xmax*420,py=y=>290-y/ymax*230;let line='M'+pts.map(([x,y])=>`${px(x)} ${py(y)}`).join('L');visual=visual.replace(/<path d="M65 [^"]+" stroke="#26734d" stroke-width="3"\/>/,`<path d="${line}" stroke="#26734d" stroke-width="3" fill="none"/>`);num(b,'hours');steps=[`The horizontal section runs from ${a} to ${a+b} hours.`,`Distance stays at ${u*a} km during this section.`,`Stop duration = ${a+b} − ${a} = ${b} hours.`];break;}

case 'budget':{let rate=C([1.25,1.5,2.5]),order=n+k,budget=Math.ceil(order*rate)+u; text=`${n} identical notebooks cost ${money(n*rate)}. A school has a budget of £${budget} and buys ${order} at the same unit price. How much money remains?`;num(budget-order*rate,'£');steps=[`One notebook = ${money(n*rate)} ÷ ${n} = ${money(rate)}.`,`Order cost = ${order} × ${money(rate)} = ${money(order*rate)}.`,`Remaining = £${budget} − ${money(order*rate)} = ${money(budget-order*rate)}.`];break;}

case 'combinedTotal':{let q=combinePair(a,b,c,d),p=q.parts;if(p[0]===p[2])return makeHigher(id);let diff=Math.abs(p[0]-p[2])*u;text=`A:B = ${a}:${b} and B:C = ${c}:${d}. ${p[0]>p[2]?'A':'C'} has £${diff} more than ${p[0]>p[2]?'C':'A'}. Find their total amount.`;num(p.reduce((x,y)=>x+y)*u,'£');full(q);steps.push(`Difference in parts = ${Math.abs(p[0]-p[2])}.`,`One part = ${diff} ÷ ${Math.abs(p[0]-p[2])} = £${u}.`,`Total = ${p.reduce((x,y)=>x+y)} × ${u} = £${p.reduce((x,y)=>x+y)*u}.`);break;}
case 'exchangeFee':{let pounds=u*50,fee=C([2,4,5]),rate=C([1.2,1.25,1.5]),net=pounds*(1-fee/100),eur=net*rate;text=`You exchange £${pounds}. A ${fee}% fee is deducted in pounds first. The remaining money is exchanged at £1 = €${rate.toFixed(2)}. How many euros do you receive? Give 2 decimal places.`;num(Math.round(eur*100)/100,'€');steps=[`Fee = ${fee}% of £${pounds} = ${money(pounds*fee/100)}.`,`Pounds exchanged = ${money(net)}.`,`Euros = ${fmt(net)} × ${rate} = €${eur.toFixed(2)}.`];break;}
case 'jointDirect':case 'directInverse':{let x1=a,y1=b,x2=c,y2=d,K=k*b*d,z1=id==='jointDirect'?K*x1*y1:K*x1/y1,z2=id==='jointDirect'?K*x2*y2:K*x2/y2;text=`z is directly proportional to ${id==='jointDirect'?'the product xy':'x and inversely proportional to y'}. When x = ${x1}, y = ${y1}, z = ${z1}. Find k, then z when x = ${x2}, y = ${y2}.`;num(K,'','k');num(z2,'','z');steps=id==='jointDirect'?[`z = kxy.`,`k = ${z1} ÷ (${x1} × ${y1}) = ${K}.`,`New z = ${K} × ${x2} × ${y2} = ${z2}.`]:[`z = ${fr('kx','y')}.`,`k = ${z1} × ${y1} ÷ ${x1} = ${K}.`,`New z = ${K} × ${x2} ÷ ${y2} = ${z2}.`];break;}
case 'workerChange':{let W=a,H=b*k,elapsed=b,newW=a*k,remaining=a*(H-elapsed)/newW;text=`${W} equally productive workers can finish a job in ${H} hours. After ${elapsed} hours, the workforce changes to ${newW} workers in total. How many additional hours are needed? Assume no delays.`;num(remaining,'hours');steps=[`Total work = ${W} × ${H} = ${W*H} worker-hours.`,`Completed work = ${W} × ${elapsed} = ${W*elapsed} worker-hours.`,`Remaining work = ${W*H-W*elapsed} worker-hours.`,`Additional time = ${W*H-W*elapsed} ÷ ${newW} = ${fmt(remaining)} hours.`];break;}
case 'compoundGrowth':case 'compoundDecay':case 'reverseGrowth':case 'compareGrowth':{let P=u*100,percent=C([2,4,5,10,20]),years=C([2,3,4]),factor=id==='compoundDecay'?1-percent/100:1+percent/100,final=P*factor**years,round=x=>Math.round((x+Number.EPSILON)*100)/100;if(id==='reverseGrowth'){text=`An investment increases by ${percent}% per year for ${years} years. Its exact final value is £${final.toFixed(8).replace(/0+$/,'').replace(/\.$/,'')}. Find its original value to the nearest penny.`;num(P,'£');steps=[`Growth multiplier = ${factor}.`,`Repeated multiplier = ${powHTML(factor,years)}.`,`Original value = ${fmt(final)} ÷ ${powHTML(factor,years)} = £${P}.`]}else if(id==='compareGrowth'){let simple=P*(1+percent*years/100),difference=final-simple;text=`Starting from £${P}, compare ${years} years of ${percent}% simple interest with ${years} years of ${percent}% compound interest. How much more does compound interest produce? Round only the final answer to the nearest penny.`;num(round(difference),'£');steps=[`Simple interest adds ${money(P*percent/100)} each year. Simple final amount = ${money(simple)}.`,`Compound final amount = ${P} × ${powHTML(factor,years)} = £${final.toFixed(6)} before rounding.`,`Difference = ${fmt(final)} − ${fmt(simple)} = ${fmt(difference)}.`,`Nearest penny = ${money(round(difference))}.`]}else{text=`${id==='compoundDecay'?'A machine worth':'An investment of'} £${P} ${id==='compoundDecay'?'decreases':'increases'} by ${percent}% each year for ${years} years. Find its final value to the nearest penny. Round only at the end.`;num(round(final),'£');steps=[`${id==='compoundDecay'?'Decay':'Growth'} multiplier = ${factor}.`,`Final value = ${P} × ${powHTML(factor,years)} = £${final.toFixed(6)} before rounding.`,`Nearest penny = ${money(round(final))}.`]}break;}
case 'findGrowthRate':{let P=u*100,r=C([2,4,5,10,20]),m=1+r/100,F=P*m*m;text=`An investment grows from £${P} to ${money(F)} over 2 years at the same annual compound percentage rate. Find that annual rate.`;num(r,'%');steps=[`Two-year multiplier = ${fmt(F)} ÷ ${P} = ${fmt(F/P)}.`,`Annual multiplier = ${rootHTML(fmt(F/P))} = ${m}.`,`Annual increase = (${m} − 1) × 100 = ${r}%.`];break;}
case 'iteration':{let start=u*10,m=C([1.1,1.2,1.5]),add=C([5,10,20]),v=start,values=[];for(let i=0;i<3;i++){let next=m*v+add;values.push([v,next]);v=next}text=`Start with ${start}. Each update multiplies the current value by ${m}, then adds ${add}. Find the value after 3 updates. Give 2 decimal places.`;num(Math.round(v*100)/100);steps=values.map(([before,after],i)=>`Update ${i+1}: ${fmt(before)} × ${m} + ${add} = ${fmt(after)}.`);steps.push(`After 3 updates: ${(Math.round(v*100)/100).toFixed(2)}.`);break;}
default:throw Error('Unknown Higher factory '+id);
}
return{id,section:skillById[id].section,text,answers,steps,visual,hint,signature:JSON.stringify([text,answers.map(x=>x.value),visual])};}

function questionFor(section){let ids=sections[section-1][2].map(x=>x[0]);if(!bags[section]?.length){bags[section]=shuffle(ids);if(bags[section][0]===lastFactory[section])[bags[section][0],bags[section][1]]=[bags[section][1],bags[section][0]]}let id=bags[section].shift();lastFactory[section]=id;return fresh(id,section)}
function fresh(id,scope){let h=Array.isArray(recent[scope])?recent[scope]:[],q;for(let i=0;i<150;i++){q=make(id);if(!h.includes(q.signature))break}if(h.includes(q.signature)){recent[scope]=h.slice(0,Math.max(0,h.length-1));return fresh(id,scope);}recent[scope]=[q.signature,...h].slice(0,40);try{sessionStorage.setItem('ratioHigherRecentV1',JSON.stringify(recent))}catch{}return q;}
function answerDisplay(a){if(a.kind==='ratio')return a.value.join(':');if(a.kind==='fraction')return fr(...a.value);if(a.kind==='number')return `${fmt(a.value)}${a.unit?' '+a.unit:''}`;return a.value;}
function solution(q){return `<div class="solution"><ol>${q.steps.map(x=>`<li>${x}</li>`).join('')}</ol><p><b>Answer${q.answers.length>1?'s':''}:</b> ${q.answers.map(a=>`${q.answers.length>1?a.label+': ':''}${answerDisplay(a)}`).join('; ')}</p></div>`;}
function inputs(q,prefix='answer'){return q.answers.map((a,i)=>`<label class="answerlabel">${a.label}${a.unit?' ('+a.unit+')':''}${a.kind==='choice'?`<select id="${prefix}${i}"><option value="">Choose…</option>${a.options.map(v=>`<option>${v}</option>`).join('')}</select>`:`<input id="${prefix}${i}" autocomplete="off" aria-label="${a.label}" placeholder="${a.kind==='ratio'?'e.g. 2:3':a.kind==='fraction'?'e.g. 2/5':'Type a number'}">`}</label>`).join('');}
function accepts(raw,a){raw=String(raw).trim();if(!raw)return false;if(a.kind==='choice')return raw.toLowerCase()===a.value.toLowerCase();if(a.kind==='number'){let clean=raw.replace(/[£€%,]/g,'').trim();if(!/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(clean))return false;return Math.abs(Number(clean)-a.value)<1e-7;}if(a.kind==='ratio'){let values=raw.split(':').map(x=>x.trim());return values.length===a.value.length&&values.every((x,i)=>/^\d+(?:\.\d+)?$/.test(x)&&Number(x)===a.value[i]);}let v=raw.split('/').map(x=>x.trim());return v.length===2&&v.every(x=>/^\d+$/.test(x))&&Number(v[1])>0&&Number(v[0])===a.value[0]&&Number(v[1])===a.value[1];}
function record(section,correct){let p=state.progress[section];if(!p||!Number.isFinite(p.attempts)||!Number.isFinite(p.correct))p={attempts:0,correct:0};p.attempts++;if(correct)p.correct++;state.progress[section]=p;save();}
function check(){if(checked)return;let vals=current.answers.map((a,i)=>$('answer'+i).value);if(vals.some(v=>!v.trim())){$('feedback').innerHTML='<p class="warning">Please complete every answer first.</p>';return}let results=current.answers.map((a,i)=>accepts(vals[i],a)),correct=results.every(Boolean);checked=true;record(sec,correct);$('checkBtn').disabled=true;$('feedback').innerHTML=`<div class="${correct?'success':'warning'}" role="status"><b>${correct?'Correct.':'Not yet.'}</b> ${correct?'You have completed this question.':'Review the steps below before trying a new question.'}${results.length>1?'<p>'+results.map((v,i)=>current.answers[i].label+': '+(v?'correct':'review')).join(' · ')+'</p>':''}</div>`+solution(current);renderNav();}
function newQuestion(){current=questionFor(sec);checked=false;render();}
function gotoSection(s){if(sec===MASTERY_SECTION)storeMastery();sec=s;mode='learn';current=null;practice=[];checked=false;render();window.scrollTo(0,0);}
function setMode(m){mode=m;current=null;checked=false;render();}
function renderNav(){document.querySelectorAll('[data-section]').forEach(b=>{let s=Number(b.dataset.section);b.classList.toggle('active',s===sec);b.setAttribute('aria-current',s===sec?'page':'false');b.onclick=()=>gotoSection(s);let badge=b.querySelector('.navstatus');if(badge)badge.textContent=state.learned[s]?'✓':'';});}
function tabs(){return `<div class="tabs" role="group" aria-label="Section activities">${[['learn','Learn'],['test','Interactive Test'],['print','Printable Practice'],['progress','Progress']].map(([m,t])=>`<button class="${m===mode?'selected':'secondary'}" onclick="setMode('${m}')">${t}</button>`).join('')}</div>`;}
function overview(){let tried=Object.values(state.progress).reduce((t,p)=>t+(Number(p.attempts)||0),0);return `<article class="card"><span class="eyebrow">Higher · Complete course</span><h2>Build confidence with ratio, proportion and rates</h2><p>Work through ${sections.length} teaching sections, then take the balanced Higher Mastery Test. Sections 1–16 build the core methods from objects and equal parts; Sections 17–${sections.length} develop the Higher skills. This course can be used independently of the Foundation product.</p><div class="key"><b>How to use this course</b><ol><li>Read each skill and its worked example in Learn.</li><li>Use Interactive Test: try the question, use Hint if needed, then Check.</li><li>Print practice questions and worked solutions for written work.</li><li>Review progress and revisit skills before the Mastery Test.</li></ol></div><p><b>${allSkills.length} taught question types</b> · ${sections.length} topic sections · ${MASTER_TOTAL}-question balanced Mastery Test</p><p>Questions rotate by skill and remember up to 40 recent exact questions (or the available unique pool for a smaller skill). Progress is saved on this device when browser storage is available; otherwise the course continues with progress for the current session.</p><p>Ratio answers use a colon (2:3). Fraction answers use a slash (2/5); fractions in teaching are displayed vertically. Enter numerical answers in the unit shown. Follow any rounding instruction.</p><p>${tried} practice questions attempted.</p><button onclick="gotoSection(1)">Start Understanding Ratio</button><button class="secondary" onclick="gotoSection(MASTERY_SECTION)">Open Mastery Test</button><p class="small">AQA · Edexcel · OCR · WJEC · IGCSE. This is a topic resource, not a claim to replace a board’s complete specification. Content varies by qualification. The two combined-variation skills in Section 24 are labelled as extension material. Check your course requirements.</p></article>`;}
function learn(){let s=sections[sec-1];return `<article class="card"><h2>${sec}. ${s[0]}</h2><p>${s[1]}</p>${sec===18?`<div class="key"><b>Cross-multiplication:</b> if ${fr('A','B')} = ${fr('a','b')}, then b × A = a × B (with non-zero denominators). Keep expressions inside brackets while expanding.</div>`:''}${sec===20?`<div class="key"><b>Powers and roots:</b> x² means x × x; x³ means x × x × x. ${rootHTML(25)} = 5 because 5² = 25. In direct proportion to x², the constant is y ÷ x². In direct proportion to ${rootHTML('x')}, the constant is y ÷ ${rootHTML('x')}.</div>`:''}${sec===21?`<div class="key"><b>Inverse means reciprocal:</b> y = ${fr('k','x')} means xy = k. It does not mean y is negative. For y = ${fr('k','x²')}, x²y = k. Use only positive x in these exercises.</div>`:''}${sec===22?`<div class="key"><b>Chord or tangent?</b> A chord joins two points on a curve and measures an average rate over an interval. A tangent follows the curve’s direction at one point and gives its instantaneous rate. To estimate a tangent gradient, use two well-separated points on that tangent and calculate vertical change ÷ horizontal change. You do not need calculus.</div>`:''}${sec===25?`<div class="key"><b>Repeated updates:</b> 5% growth uses multiplier 1.05; 5% decay uses multiplier 0.95. After n periods, use the nth power of the multiplier. A rule such as V<sub>n+1</sub> = 1.1V<sub>n</sub> + 5 means multiply the current V by 1.1, then add 5 to get the next V.</div>`:''}${sec===1?`<div class="key"><b>Reading the notation:</b> The colon is read “to”. Blue:red = 2:3 means 2 blue for every 3 red. These are two parts compared with each other, not blue compared with all five objects.</div>${dots(2,3)}${bars(2,3,['Blue','Red'],'The same 2:3 comparison using equal-sized blocks')}<p>There are 5 parts altogether. Blue is 2 of those 5 parts. The coloured groups match the written order.</p>`:''}${sec===2?'<div class="key"><b>Finding the HCF:</b> A factor divides a whole number exactly, with no remainder. List the factors of each part and find the largest factor in every list. For 12:18, factors of 12 are 1, 2, 3, 4, 6, 12; factors of 18 are 1, 2, 3, 6, 9, 18. The highest common factor is 6. Dividing both parts by 6 gives 2:3.</div>':''}${sec===5?'<div class="key"><b>Known total:</b> £84 shared in 3:4 means 7 parts altogether; one part is £12; shares are £36 and £48.</div>':''}${sec===6?'<div class="key"><b>Known share:</b> Tom:Sam = 3:4 and Tom has £36. The £36 represents Tom’s 3 parts, so one part is £12 and Sam has £48. This is different from sharing a known total.</div>':''}</article>${s[2].map(([id,title,method,mistake])=>{let key=sec+'|'+id;if(!learnExamples[key])learnExamples[key]=fresh(id,'learn'+sec);let q=learnExamples[key];return `<article class="card"><h3>${title}</h3><p>${method}</p><div class="example"><h4>Worked example</h4><p>${q.text}</p>${q.visual}${solution(q)}</div><div class="warning"><b>Watch for:</b> ${mistake}</div><button class="secondary" onclick="refreshExample('${id}')">Another worked example</button><button onclick="testSkill('${id}')">Practise this skill</button></article>`}).join('')}`+`<article class="card"><label><input type="checkbox" ${state.learned[sec]?'checked':''} onchange="markLearned(this.checked)"> I have read the teaching and worked examples for this section.</label><p><button onclick="setMode('test')">Start Interactive Test</button>${sec<sections.length?`<button class="secondary" onclick="gotoSection(${sec+1})">Next section</button>`:`<button class="secondary" onclick="gotoSection(MASTERY_SECTION)">Mastery Test</button>`}</p></article>`;}
function refreshExample(id){learnExamples[sec+'|'+id]=fresh(id,'learn'+sec);render();}
function testSkill(id){bags[sec]=(bags[sec]||[]).filter(x=>x!==id);mode='test';current=fresh(id,sec);lastFactory[sec]=id;checked=false;render();window.scrollTo(0,0);}

function interactive(){if(!current)current=questionFor(sec);return `<article class="card"><span class="eyebrow">${skillById[current.id].title}</span><h2>Interactive Test</h2><p>${current.text}</p>${current.visual}<div class="answers">${inputs(current)}</div><div class="actions"><button class="secondary" onclick="$('hint').hidden=false">Hint</button><button id="checkBtn" onclick="check()" ${checked?'disabled':''}>Check</button><button class="secondary" onclick="$('worked').hidden=false">Worked Solution</button><button onclick="newQuestion()">Next Question</button></div><div id="hint" class="key" hidden>${current.hint}</div><div id="feedback" aria-live="polite"></div><div id="worked" hidden>${solution(current)}</div><p class="small">Each question counts once. Looking at a hint or solution does not itself record a score.</p></article>`;}

function printSet(sol,qs=practice,title=sections[sec-1]?.[0]||'Higher Mastery Test'){let node=$('printArea');node.innerHTML=`<h1>Mr Nathan’s Maths Tuition</h1><h2>GCSE Ratio, Proportion &amp; Rates of Change Mastery</h2><h3>Higher — ${title}${sol?' — Worked Solutions':''}</h3><p>Name: __________________________ Date: ______________</p>${qs.map((q,i)=>`<section class="printquestion"><h3>${i+1}. ${skillById[q.id].title}</h3><p>${q.text}</p>${q.visual}${sol?solution(q):q.answers.map(a=>`<p>${a.label}${a.unit?' ('+a.unit+')':''}: __________________________________________________</p>`).join('')+'<div class="workspace higherworkspace"></div>'}</section>`).join('')}`;document.body.classList.add('printing');window.print();}
window.addEventListener('afterprint',()=>document.body.classList.remove('printing'));
function progress(){let p=state.progress[sec]||{attempts:0,correct:0},percent=p.attempts?Math.round(100*p.correct/p.attempts):0;return `<article class="card"><h2>Section Progress</h2><p>${state.learned[sec]?'✓ Teaching marked as read.':'Teaching not yet marked as read.'}</p><p><b>${p.correct} correct out of ${p.attempts} attempted · ${percent}%</b></p><div class="progressbar"><span style="width:${percent}%"></span></div><p>These are practice results. A section is not automatically mastered by reading it or answering a small number of questions.</p><button onclick="setMode('test')">Continue practice</button><h3>Course progress</h3>${table(['Section','Read','Correct / attempted'],sections.map((s,i)=>{let r=state.progress[i+1]||{correct:0,attempts:0};return[s[0],state.learned[i+1]?'Yes':'No',`${r.correct} / ${r.attempts}`]}))}<button class="danger" onclick="resetProgress()">Reset all progress</button></article>`;}

function balancedQuestions(){let qs=[];for(let s=1;s<=sections.length;s++){let selected=new Set();while(selected.size<masteryWeights[s-1]){let q=questionFor(s);if(!selected.has(q.id)){selected.add(q.id);qs.push(q)}}};return shuffle(qs)}
function startMastery(){mastery={qs:balancedQuestions(),answers:Array.from({length:MASTER_TOTAL},()=>[]),submitted:false};questionIndex=0;render();}

function submitMastery(){storeMastery();let missing=mastery.answers.filter((v,i)=>v.length!==mastery.qs[i].answers.length||v.some(x=>!x.trim())).length;if(!window.confirm(missing?`${missing} unanswered or incomplete questions will score zero. Submit the test?`:'Submit this Mastery Test?'))return;mastery.submitted=true;mastery.results=mastery.qs.map((q,i)=>q.answers.every((a,j)=>accepts(mastery.answers[i]?.[j]||'',a)));let score=mastery.results.filter(Boolean).length;state.mastery.unshift({date:new Date().toISOString(),score,total:MASTER_TOTAL});state.mastery=state.mastery.slice(0,10);save();render();}
function masteryView(){if(!mastery)return `<article class="card"><h2>${MASTERY_SECTION}. Higher Mastery Test</h2><p>${MASTER_TOTAL} questions: one core skill from each of Sections 1–16, then three different Higher skills from each of Sections 17–${sections.length}. A new test rotates the chosen skills and values.</p><p>Use paper and a calculator where needed. You can move backwards and forwards. Hints and solutions become available after submission.</p><p>Every complete question earns one mark. Questions with multiple answers need all answers correct. There is no partial marking.</p><p>This gives a balanced sample of the course, rather than testing all ${allSkills.length} skills in one sitting. Further tests sample different skills. Higher sections supply most questions in this test.</p><button onclick="startMastery()">Start New Mastery Test</button><button class="secondary" onclick="masteryPaper(false)">Generate &amp; Print Paper Test</button><button class="secondary" onclick="masteryPaper(true)">Print Paper Worked Solutions</button><p class="small">Paper solutions match the most recently generated paper test in this open session. Paper work is not automatically scored.</p><h3>Recent results</h3>${state.mastery.length?table(['Date','Score'],state.mastery.map(r=>[new Date(r.date).toLocaleDateString('en-GB'),r.score+' / '+r.total])):'<p>No completed tests yet.</p>'}</article>`;
if(mastery.submitted){let score=mastery.results.filter(Boolean).length,totals={};mastery.qs.forEach((q,i)=>{totals[q.section] ||= {correct:0,total:0};totals[q.section].total++;if(mastery.results[i])totals[q.section].correct++});return `<article class="card"><h2>Mastery Test Results</h2><p class="bigscore">${score} / ${MASTER_TOTAL} · ${Math.round(score/MASTER_TOTAL*100)}%</p><p>${score>=Math.ceil(MASTER_TOTAL*.875)?'Strong performance. Revisit any missed skills and try another balanced test.':score>=Math.ceil(MASTER_TOTAL*.625)?'You have a useful foundation. Revisit the sections where you lost marks.':'Return to the teaching for the sections below and practise in small steps.'}</p>${table(['Section','Score'],sections.map((s,i)=>[s[0],`${totals[i+1].correct} / ${masteryWeights[i]}`]))}<button onclick="startMastery()">New Mastery Test</button><button class="secondary" onclick="printSet(false,mastery.qs,'Higher Mastery Test')">Print Test</button><button class="secondary" onclick="printSet(true,mastery.qs,'Higher Mastery Test')">Print Worked Solutions</button></article>${mastery.qs.map((q,i)=>`<article class="card"><h3>${i+1}. ${mastery.results[i]?'✓ Correct':'Review'} — ${skillById[q.id].title}</h3><p>${q.text}</p>${q.visual}<p><b>Your answer:</b> ${mastery.answers[i].map(escapeHtml).join('; ')||'Not answered'}</p>${solution(q)}<button class="secondary" onclick="gotoSection(${q.section})">Review Section ${q.section}</button></article>`).join('')}`;}
let q=mastery.qs[questionIndex];return `<article class="card"><span class="eyebrow">Section ${q.section} · ${skillById[q.id].title}</span><h2>Mastery Test — Question ${questionIndex+1} of ${MASTER_TOTAL}</h2><p>${q.text}</p>${q.visual}<div class="answers">${inputs(q,'master')}</div><div class="actions"><button class="secondary" onclick="moveMastery(${questionIndex-1})" ${questionIndex===0?'disabled':''}>Previous</button><button onclick="moveMastery(${questionIndex+1})" ${questionIndex===MASTER_TOTAL-1?'disabled':''}>Next</button><button onclick="submitMastery()">Submit Test</button></div><div class="questiongrid">${mastery.qs.map((x,i)=>`<button class="${i===questionIndex?'selected':mastery.answers[i].length&&mastery.answers[i].every(v=>v.trim())?'answered':'secondary'}" onclick="moveMastery(${i})">${i+1}</button>`).join('')}</div><p class="small">Highlighted numbered buttons have an answer entered. The test in progress lasts for this open session.</p></article>`;}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function render(){renderNav();$('app').innerHTML=sec===0?overview():sec===MASTERY_SECTION?masteryView():tabs()+(mode==='learn'?learn():mode==='test'?interactive():mode==='print'?printable():progress());if(sec===MASTERY_SECTION&&mastery&&!mastery.submitted)mastery.answers[questionIndex].forEach((v,i)=>{if($('master'+i))$('master'+i).value=v});}
render();
</script></body></html>
